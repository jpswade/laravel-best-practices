name: validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12', '13']
        exclude:
          # illuminate/support 13.x declares "php ^8.3" — hard composer conflict on PHP 8.2.
          - php: '8.2'
            laravel: '13'
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: PHP lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate pint.json
        run: php -r 'json_decode(file_get_contents("pint.json"), null, 512, JSON_THROW_ON_ERROR);'

      # Force the chosen Laravel major so we actually resolve and install
      # against Laravel ${{ matrix.laravel }}, rather than letting composer
      # pick the highest compatible version on every run.
      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require --dev "nette/neon:^3.4" --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction

      - name: Verify resolved illuminate/support major
        run: |
          RESOLVED=$(composer show illuminate/support --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0] ?? "";')
          echo "Resolved illuminate/support: $RESOLVED"
          case "$RESOLVED" in
            v${{ matrix.laravel }}.*) ;;
            *) echo "Expected v${{ matrix.laravel }}.x but got $RESOLVED"; exit 1 ;;
          esac

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked --no-interaction

      - name: Validate phpstan.neon.dist
        run: php -r 'require "vendor/autoload.php"; Nette\Neon\Neon::decode(file_get_contents("phpstan.neon.dist"));'

      - name: Smoke-test service provider autoload
        run: php -r 'require "vendor/autoload.php"; $r = new ReflectionClass(Jpswade\LaravelBestPractices\LaravelBestPracticesServiceProvider::class); echo $r->getName(), PHP_EOL;'
