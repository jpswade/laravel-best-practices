# Codex beta permission-profile fragment; merge into an EXISTING selected profile.
# Replace "project" with its name. Do not replace config.toml or other protections.
# See docs/host-controls.md for selection, legacy settings, and platform limits.
[permissions.project.filesystem.":workspace_roots"]
"**/.env*" = "deny"
"**/*.env" = "deny"
"**/*.env.*" = "deny"
"**/auth.json" = "deny"
"**/auth.json.*" = "deny"
"**/.npmrc*" = "deny"
"**/.yarnrc*" = "deny"
"**/.pypirc*" = "deny"
"**/.netrc*" = "deny"
"**/_netrc*" = "deny"
"**/.git-credentials*" = "deny"
"**/.gitconfig*" = "deny"
"**/.pgpass*" = "deny"
"**/.my.cnf*" = "deny"
"**/.vault-token*" = "deny"
"**/credentials" = "deny"
"**/credentials.*" = "deny"
"**/secrets/**" = "deny"
"**/secrets.*" = "deny"
"**/*.secrets.*" = "deny"
"**/*.key" = "deny"
"**/*.key.*" = "deny"
"**/*.pem" = "deny"
"**/*.pem.*" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/*.jks" = "deny"
"**/*.keystore" = "deny"
"**/id_rsa*" = "deny"
"**/id_dsa*" = "deny"
"**/id_ecdsa*" = "deny"
"**/id_ed25519*" = "deny"
"**/service-account*.json" = "deny"
"**/service_account*.json" = "deny"
"**/*-service-account.json" = "deny"
"**/.ssh/**" = "deny"
"**/.gnupg/**" = "deny"
"**/.aws/**" = "deny"
"**/.azure/**" = "deny"
"**/.kube/**" = "deny"
"**/.docker/**" = "deny"
"**/.config/gcloud/**" = "deny"
"**/.config/composer/**" = "deny"
"**/.composer/**" = "deny"
"**/bootstrap/cache/config.php*" = "deny"
"**/storage/logs/**" = "deny"
"**/storage/framework/cache/**" = "deny"
"**/storage/framework/sessions/**" = "deny"
"**/*.log" = "deny"
"**/*.log.*" = "deny"
"**/*.sqlite" = "deny"
"**/*.sqlite*" = "deny"
"**/*.db" = "deny"
"**/*.sql" = "deny"
"**/*.sql.*" = "deny"
"**/*.dump" = "deny"
"**/*.dump.*" = "deny"
"**/backups/**" = "deny"
"**/*.bak" = "deny"
"**/*.backup" = "deny"
"**/.git/**" = "deny"

# Outside-workspace examples: extend for your own credential stores.
[permissions.project.filesystem]
"~/.composer" = "deny"
"~/.config/composer" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
